<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    
    .auth-box { margin-bottom: 30px; padding: 22px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    input { padding: 12px; margin-right: 8px; border-radius: 8px; border: 1px solid #51667c; background: #101a28; color: white; font-size: 15px; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #8ad8df; color: #101a28; font-weight: bold; cursor: pointer; font-size: 15px; }
    button:hover { background: #6bc0c7; }
    .error-msg { color: #d07384; margin-top: 12px; font-weight: bold; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 인증 추가</div>
    <h1>안전한 자료실</h1>
    
    <div id="login-section" class="auth-box">
      <h2>로그인</h2>
      <div style="margin-top: 16px;">
        <input type="email" id="email" placeholder="이메일 주소" required />
        <input type="password" id="password" placeholder="비밀번호" required />
        <button id="login-btn">접속하기</button>
      </div>
      <div id="login-error" class="error-msg"></div>
    </div>

    <div id="main-section" style="display: none;">
      <div class="auth-box flex-between" style="background: #243b55;">
        <span>정상적으로 로그인되었습니다.</span>
        <button id="logout-btn">로그아웃</button>
      </div>
      
      <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
      <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://aqeglcbdaaaixmznyavk.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable__0lfwQ9FyS4Y2af_2nJisQ_CDTsVHpB';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginSection = document.getElementById('login-section');
    const mainSection = document.getElementById('main-section');
    const loginError = document.getElementById('login-error');
    const list = document.querySelector('#notes');

    async function fetchNotes() {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        const accessToken = session ? session.access_token : '';

        const response = await fetch('/api/notes', { 
          cache: 'no-store',
          headers: {
            'Authorization': `Bearer ${accessToken}`
          }
        });

        if (!response.ok) {
          // 서버가 보내온 진짜 에러 메시지를 꺼냅니다.
          const errData = await response.json().catch(() => ({ error: '알 수 없는 응답' }));
          throw new Error(`[서버 거부] ${errData.error} (상태코드: ${response.status})`);
        }
        
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch (error) {
        const item = document.createElement('li');
        item.style.color = '#d07384';
        item.style.fontWeight = 'bold';
        item.textContent = error.message; // 구체적인 에러 표시
        list.replaceChildren(item);
      }
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      loginError.textContent = ''; 

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = `로그인 실패: ${error.message}`;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        loginSection.style.display = 'none';
        mainSection.style.display = 'block';
        fetchNotes();
      } else {
        loginSection.style.display = 'block';
        mainSection.style.display = 'none';
        list.innerHTML = '<li>가상 자료를 불러오는 중입니다.</li>';
      }
    });
  </script>
</body>
</html>
